# Test profile — flapdoodle embedded MongoDB is auto-configured; no URI needed.
spring.data.mongodb.auto-index-creation=true
# Embedded Mongo version used by flapdoodle
de.flapdoodle.mongodb.embedded.version=7.0.0

# JWT — fixed secret so tests are deterministic
jwt.secret=TestSecretKey2024XYZabc123456789PQRSTUVWXYZabcdef0123456789abcdef
jwt.expiration=3600000

# CORS (required by SecurityConfig bean)
cors.allowed-origins=http://localhost:5173

# Logging (quiet during test runs)
logging.level.com.safecircle=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
