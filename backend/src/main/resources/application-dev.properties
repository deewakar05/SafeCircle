# Server
server.port=8080

# MongoDB (Local Development)
spring.data.mongodb.uri=mongodb://localhost:27017/safecircle
spring.data.mongodb.database=safecircle
spring.data.mongodb.auto-index-creation=true

# JWT (Development Dummy Secret)
jwt.secret=SafeCircleSecretKey2024XYZabc123456789PQRSTUVWXYZabcdef0123456789abcd
jwt.expiration=86400000

# CORS (Development)
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000

# Logging (Development)
logging.level.com.safecircle=DEBUG
logging.level.org.springframework.security=WARN
