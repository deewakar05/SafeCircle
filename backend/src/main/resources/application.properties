# Server
server.port=8080

# MongoDB — change this URI to your MongoDB Atlas connection string
# Atlas:  spring.data.mongodb.uri=mongodb+srv://user:pass@cluster.mongodb.net/safecircle?retryWrites=true&w=majority
# Local:  spring.data.mongodb.uri=mongodb://localhost:27017/safecircle
spring.data.mongodb.uri=mongodb://localhost:27017/safecircle
spring.data.mongodb.database=safecircle

# Disable immediate boot failure if MongoDB is not reachable at startup
spring.data.mongodb.auto-index-creation=false

# JWT
jwt.secret=SafeCircleSecretKey2024XYZabc123456789PQRSTUVWXYZabcdef0123456789abcd
jwt.expiration=86400000

# CORS (dev)
cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000

# Logging
logging.level.com.safecircle=DEBUG
logging.level.org.springframework.security=WARN
